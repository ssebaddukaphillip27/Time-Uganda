name: Build HTML to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create myapp com.app.time "Time"
          # Copy all root files into Cordova www directory
          cp -r index.html css js assets img myapp/www/ 2>/dev/null || cp index.html myapp/www/
          cd myapp
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Time-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk 
